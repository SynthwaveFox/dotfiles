# Brave runs on native Wayland. Through XWayland (xwayland-satellite) it
# lagged on the 144 Hz monitor and couldn't take drag-and-drop from Wayland
# apps. If whole-page flicker comes back on NVIDIA, uncomment the next line
# to fall back to XWayland.
# --ozone-platform=x11
--disable-features=WaylandOverlayDelegation
