# NVIDIA + native Wayland kept flickering (whole page flashing, even with
# WaylandOverlayDelegation off), so Brave runs through XWayland instead.
# Every monitor is scale 1, so there's no blur cost. To go back to Wayland,
# delete the --ozone-platform line.
--ozone-platform=x11
--disable-features=WaylandOverlayDelegation
