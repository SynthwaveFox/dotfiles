# Only the Antlion mic (input) and HyperX Cloud Alpha (output) on EXODUS
monitor.alsa.rules = [
  {
    # NVIDIA HDMI/DP audio and the motherboard's onboard audio
    matches = [
      { device.name = "alsa_card.pci-0000_01_00.1" }
      { device.name = "alsa_card.pci-0000_10_00.6" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    # The headset's own mic (the Antlion is used instead)
    matches = [
      { node.name = "~alsa_input.usb-HP__Inc_HyperX_Cloud_Alpha_Wireless.*" }
    ]
    actions = { update-props = { node.disabled = true } }
  }
]
