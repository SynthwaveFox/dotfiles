# "Antlion Mic": a virtual mic on top of the real Antlion, used as the default input.
# Discord re-applies its Input Volume slider to whatever mic it uses whenever an
# audio device appears (e.g. the HD60 S). It now moves this virtual mic instead,
# so the real Antlion stays where it is set (95%; it was found to clip above 90%, so
# drop it back to 90% if voice crackles on loud parts).
pulse.cmd = [
  { cmd = "load-module" args = "module-remap-source source_name=antlion_mic master=alsa_input.usb-Antlion_Audio_Antlion_USB_Microphone-00.mono-fallback channels=1 channel_map=mono source_properties=device.description=Antlion_Mic" flags = [ "nofail" ] }
]
